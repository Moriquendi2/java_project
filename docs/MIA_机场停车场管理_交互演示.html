<script>(()=>{'use strict';
const $=id=>document.getElementById(id);
const icon=(name,size=16)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const number=(n,d=0)=>Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const currency=n=>`$ ${number(n,2)}`;
const fmt=t=>new Date(t).toLocaleString('zh-CN',{timeZone:'UTC',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const fulltime=t=>new Date(t).toISOString().replace('T',' ').slice(0,19);
const ZONES=['A','B','C'];
const HALLS={A:[1,2],B:[3,4],C:[5,6]};
const HALLCOLORS=['#fff4c5','#fbd7c8','#dedff1','#dbe9c9','#d7dce4','#ffc58f'];
const STATUS={free:{text:'空闲',css:'gray',fill:'#e6eaf0',stroke:'#c3cedb'},pending:{text:'已分配·待停入',css:'green',fill:'#b6efd7',stroke:'#49b989'},occupied:{text:'正常占用',css:'green',fill:'#a2e3c7',stroke:'#33a879'},illegal:{text:'违规停放',css:'red',fill:'#f9b9c1',stroke:'#d95a67'},overdue:{text:'超时停放',css:'orange',fill:'#f8d29b',stroke:'#dd983b'},disabled:{text:'不可用',css:'dark',fill:'#4f5e70',stroke:'#374456'}};
const USER_TYPES={'occasional':'临时用户','subscriber':'订阅用户','airport':'机场员工','airline':'航空员工','transport':'专业运输'};
const GATES={'WEST':'西入口 / West Gate','EAST':'东入口 / East Gate','SOUTH':'南入口 / South Gate'};
const KEY='mia-parking-prototype-v3'; const BKEY='mia-parking-checkpoint-v3';
let ui={page:'dashboard',depth:'all',zone:'B',aisle:'X',filterStatus:'all',filterType:'all',search:'',securityFilter:'all',logFilter:'all',deviceFilter:'all',userFilter:'all'};
let loop=null,seq=1;
function seedRand(n){const x=Math.sin(n*17.179+9.74)*43758.5453;return x-Math.floor(x)}
function initialState(){
  const initial=Date.UTC(2026,10,23,9,20),spots=[],sessions=[],logs=[],alerts=[];
  for(const zone of ZONES)for(const aisle of ['X','Y','Z','W'])for(let n=1;n<=12;n++){
    let idx=(ZONES.indexOf(zone)*48)+['X','Y','Z','W'].indexOf(aisle)*12+n;
    let type=n%11===0?'longterm':n%9===0?'utility':n%7===0?'airline':n%6===0?'staff':n%5===0?'motorcycle':'general';
    spots.push({id:`${zone}-${aisle}${String(n).padStart(2,'0')}`,zone,aisle,n,type,ev:n%8===0,accessible:n%17===0,status:'free',cam:'online',sensor:'online',plate:null,assignedTo:null});
  }
  let ci=0;const seedCounts={A:31,B:37,C:34};
  for(const zone of ZONES){
    const ss=spots.filter(s=>s.zone===zone).sort((a,b)=>seedRand(a.n*31+a.id.charCodeAt(2)+zone.charCodeAt(0))-.5);
    for(const sp of ss.slice(0,seedCounts[zone])){
      ci++;const plate=`MIA-${String(1100+ci*23).slice(-4)}`;
      const userClass=sp.type==='staff'?'airport':sp.type==='airline'?'airline':sp.type==='utility'?'transport':ci%5===0?'subscriber':'occasional';
      const mins=20+Math.floor(seedRand(ci)*280),started=initial-mins*60000;
      const s={id:`S${String(ci).padStart(5,'0')}`,plate,userClass,zone,hall:pick(HALLS[zone]),flight:`MI${100+ci}`,gate:pick(Object.keys(GATES)),assignedSpot:sp.id,actualSpot:sp.id,status:'parked',enteredAt:started-7*60000,parkedAt:started,leftAt:null,exitedAt:null,intendedMin:ci%9===0?65:160+Math.floor(seedRand(ci+9)*210),ev:sp.ev,accessible:sp.accessible,paid:false,fine:0,stale:false};
      sessions.push(s);sp.status='occupied';sp.plate=plate;sp.assignedTo=s.id;
    }
  }
  const bad=spots.find(s=>s.id==='B-Y06');if(bad){bad.status='illegal';const s=sessions.find(v=>v.id===bad.assignedTo);if(s){s.fine=250;s.violation='错位停车'}}
  const long=spots.find(s=>s.zone==='C'&&s.status==='occupied'&&s.type==='general');if(long){long.status='overdue';const s=sessions.find(v=>v.id===long.assignedTo);if(s){s.fine=120;s.violation='超时停放'}}
  const broken=spots.find(s=>s.id==='A-X01');if(broken&&broken.status==='free'){broken.status='disabled';broken.sensor='offline'}
  const makeAlert=(severity,title,description,spotId,type)=>({id:'AL'+String(100+alerts.length),severity,title,description,spotId,type,status:'new',at:initial-(alerts.length+1)*60000,assignedTo:''});
  alerts.push(makeAlert('red','违规车位占用','摄像头检测到车位与分配车牌不一致','B-Y06','illegal'));
  alerts.push(makeAlert('orange','停车超出预期时长','车辆停车时间超过入场申报时限',long?.id||'C-X04','overdue'));
  alerts.push(makeAlert('orange','Zone B 接近负荷阈值','当前使用率接近 80%，建议监测入口流量',null,'capacity'));
  const events=['已同步三区停车位占用状态','西入口识别车牌 MIA-1790','缓存与车位传感器状态校验完成','Zone B 车位 B-X03 分配成功','南入口道闸执行开闸指令','车位 B-Y06 触发车辆不匹配告警','控制中心收到移动巡逻队状态报告','停车场时间模块已就绪'];
  events.forEach((msg,i)=>logs.push({id:i+1,at:initial-(i+1)*60000,type:i===5?'security':i===2?'device':'system',message:msg,ref:'SYSTEM'}));
  return {version:3,now:initial,run:false,step:0,spots,sessions,alerts,logs,motions:[],history:Array.from({length:15},(_,i)=>({time:initial-(14-i)*20*60000,A:59+i*.75+Math.sin(i)*3,B:64+i*.85+Math.cos(i)*2,C:67+i*.55+Math.sin(i/2)*2})),settings:{speed:4,arrival:48,anomaly:5,stay:75,zoneA:33,zoneB:34,zoneC:33,maxConcurrent:120,autoPayment:true,alerts:true,checkpointEvery:15},thresholds:{},gateStates:{WEST:'idle',EAST:'idle',SOUTH:'idle'},users:[{id:'SUB-10021',name:'王先生',plate:'MIA-2008',userClass:'subscriber',state:'active'},{id:'EMP-2044',name:'陈女士',plate:'MIA-2256',userClass:'airport',state:'active'},{id:'AIR-3907',name:'Alex Morgan',plate:'MIA-2547',userClass:'airline',state:'active'},{id:'BUS-0712',name:'Airport Shuttle',plate:'MIA-2729',userClass:'transport',state:'active'}],seq:400,lastCheckpoint:null};
}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version===3&&Array.isArray(s.spots)&&s.spots.length===144&&Array.isArray(s.sessions)){s.run=false;s.settings.maxConcurrent??=120;s.settings.zoneA??=33;s.settings.zoneB??=34;s.settings.zoneC??=33;return s}}catch(e){}return initialState()}
let state=loadState();
function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,run:false}))}catch(e){}}
function log(type,message,ref='SYSTEM'){state.logs.unshift({id:++state.seq,at:state.now,type,message,ref});state.logs=state.logs.slice(0,500)}
function toast(message,tone=''){const box=$('toast-container');while(box.children.length>=3)box.firstElementChild.remove();const node=document.createElement('div');node.className='toast '+tone;node.innerHTML=icon(tone==='red'?'warning':'check')+`<span>${safe(message)}</span>`;$('toast-container').append(node);setTimeout(()=>node.remove(),3400)}
function alertNew(severity,title,description,spotId,type){const a={id:'AL'+(++state.seq),severity,title,description,spotId,type,status:'new',at:state.now,assignedTo:''};state.alerts.unshift(a);log('security',title+(spotId?' · '+spotId:''),spotId||type);if(state.settings.alerts)toast(title,severity==='red'?'red':'');return a}
function stats(zone){const spots=state.spots.filter(s=>!zone||s.zone===zone),total=spots.length,used=spots.filter(s=>['occupied','pending','illegal','overdue'].includes(s.status)).length,disabled=spots.filter(s=>s.status==='disabled').length,pending=spots.filter(s=>s.status==='pending').length,illegal=spots.filter(s=>s.status==='illegal').length;return{total,used,disabled,pending,illegal,free:total-used-disabled,rate:total?used/total*100:0}}
function getSpot(id){return state.spots.find(s=>s.id===id)}
function getSession(id){return state.sessions.find(s=>s.id===id)}
function activeTrips(){return state.sessions.filter(s=>s.status!=='complete')}
function activeAlerts(){return state.alerts.filter(a=>a.status!=='resolved')}
function zoneForHall(h){return h<=2?'A':h<=4?'B':'C'}
function cameraCount(){return state.spots.filter(s=>s.cam==='online').length+3}
function deviceOnline(){return state.spots.filter(s=>s.cam==='online').length+state.spots.filter(s=>s.sensor==='online').length+6}
function renderTop(){const active=activeAlerts().filter(a=>a.status==='new').length;const badge=$('nav-alert-count');badge.textContent=active;badge.style.display=active?'':'none';$('top-sim-badge').textContent=state.run?'仿真运行中':'仿真待机';$('top-sim-badge').className=state.run?'tag':'tag orange';$('footer-clock').textContent='SIM '+fulltime(state.now);}
function badge(status){let k=STATUS[status]||STATUS.free;return `<span class="pill ${k.css}">${k.text}</span>`}
function classBadge(c){return `<span class="pill ${c==='occasional'?'gray':c==='subscriber'?'blue':'green'}">${USER_TYPES[c]||c}</span>`}
function pageHead(t,e,desc,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${e}</div><h1 class="page-title">${t}</h1><div class="page-desc">${desc}</div></div><div class="actions">${actions}</div></div>`}
function btn(action,text,style='btn',attrs=''){return `<button class="${style}" data-action="${action}" ${attrs}>${text}</button>`}
function render(){renderTop();const PAGE={dashboard:renderDashboard,spaces:renderSpaces,vehicles:renderVehicles,security:renderSecurity,fees:renderFees,devices:renderDevices,users:renderUsers,logs:renderLogs,simulation:renderSimulation,backup:renderBackup};$('content').innerHTML=PAGE[ui.page]();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===ui.page));}
function toPage(page){ui.page=page;ui.search='';ui.deviceFilter='all';render();window.scrollTo({top:0,behavior:'instant'});}
function snapshot(silent=false){try{state.lastCheckpoint=state.now;const snap={...state,run:false,motions:[]};localStorage.setItem(BKEY,JSON.stringify(snap));save();return true}catch(e){if(!silent)toast('本地存储不可用，无法保存快照','red');return false}}
function resetEverything(){stop();state=initialState();ui={...ui,depth:'all',zone:'B',aisle:'X'};snapshot();render();toast('已恢复初始演示场景');}
function getRateMin(min,userClass,existingFine=0){let hrs=Math.max(1,Math.ceil(min/60));let base=0;const fullWeeks=Math.floor(hrs/(24*7));let leftover=hrs%(24*7);
  if(hrs<24){base=8+Math.max(0,hrs-1)*5}
  else if(hrs<=72){base=hrs<=24?86:hrs<=48?155:218}
  else if(hrs<=168){base=420}
  else{base=fullWeeks*420;if(leftover>0){if(leftover<=24)base+=Math.min(86,8+Math.max(0,leftover-1)*5);else if(leftover<=48)base+=155;else if(leftover<=72)base+=218;else base+=420}}
  let discount=userClass==='subscriber'?0.2:userClass==='airline'?0.5:userClass==='airport'&&hrs<24?0.5:0;
  if(userClass==='transport'&&hrs<=24)base=0;
  return {base,discount,fee:Math.round(base*(1-discount)*100)/100,fine:existingFine,total:Math.round((base*(1-discount)+existingFine)*100)/100};
}
function stayMinutes(s){return Math.max(1,Math.round(((s.leftAt||state.now)-(s.parkedAt||s.enteredAt))/60000))}
function chooseSpot(zone,opts={}){let arr=state.spots.filter(s=>s.zone===zone&&s.status==='free'&&s.cam==='online'&&s.sensor==='online');

function modal(title,body,foot){$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal-foot').innerHTML=foot||btn('close-modal','关闭','btn');$('modal-back').classList.add('show')}
function closeModal(){$('modal-back').classList.remove('show')}
const field=(title,v)=>`<div class="detail-field"><small>${title}</small><strong>${safe(v??'—')}</strong></div>`;
const divLine='<div class="divider"></div>';
function openSpot(id){const s=getSpot(id);if(!s){toast('未找到该车位','red');return}const sess=state.sessions.find(x=>x.id===s.assignedTo);let name={general:'普通汽车',motorcycle:'摩托车',staff:'机场员工专用',airline:'航空人员专用',utility:'商用/大车',longterm:'长期停车'}[s.type];
 const cap=(s.ev?' · EV充电':'')+(s.accessible?' · 无障碍':'');
 let body=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:17px"><div><div class="eyebrow">PARKING SPACE</div><div style="font-size:28px;font-weight:850" class="mono">${s.id}</div></div>${badge(s.status)}</div><div class="detail-grid">${field('所属分区',`Zone ${s.zone} / Aisle ${s.aisle}`)}${field('停车类型',name+cap)}${field('当前车辆',s.plate||'—')}${field('分配状态',STATUS[s.status].text)}${field('摄像头',s.cam==='online'?'在线 · 识别正常':'离线 / 自检失败')}${field('地磁传感器',s.sensor==='online'?'在线 · 状态同步':'离线 / 自检失败')}</div>`;
 if(sess){const fee=sess.parkedAt?getRateMin(stayMinutes(sess),sess.userClass,sess.fine||0).total:0;body+=divLine+`<h4 class="section-title" style="margin-bottom:13px">车辆会话</h4><div class="detail-grid">${field('车牌',sess.plate)}${field('用户类型',USER_TYPES[sess.userClass])}${field('相关航班',sess.flight)}${field('目的地',`Hall ${sess.hall}`)}${field('入口时间',fmt(sess.enteredAt))}${field('开始计费',sess.parkedAt?fmt(sess.parkedAt):'等待传感器触发')}${field('已计费时长',sess.parkedAt?stayMinutes(sess)+' 分钟':'未开始')}${field('当前预估费用',currency(fee))}</div>`}
 body+=divLine+`<div class="modal-note">摄像头：${s.cam==='online'?'OCR 自检通过':'需检修'}；地磁：${s.sensor==='online'?'心跳正常':'设备异常'}。车位状态变化由传感器事件触发，并由摄像头车牌识别确认。</div>`;
 let foot=`${btn('device-detail',icon('camera',14)+' 摄像头','btn','data-id="CAM-'+s.id+'" data-kind="camera"')}${btn('device-detail',icon('sensor',14)+' 传感器','btn','data-id="SNR-'+s.id+'" data-kind="sensor"')}${s.status==='free'?btn('disable-spot','停用车位','btn danger','data-spot="'+s.id+'"'):s.status==='disabled'?btn('enable-spot','重新启用','btn good','data-spot="'+s.id+'"'):''}${btn('close-modal','关闭','btn')}`;
 modal('车位 / Parking Spot',body,foot);

}
function openGate(gate){const g=state.gateStates[gate],u=state.sessions.filter(s=>s.gate===gate&&s.status!=='complete').length;
 modal(`${GATES[gate]} · 道闸控制`,`<div class="detail-grid">${field('设备编号','BAR-'+gate)}${field('设备状态','模拟连接正常')}${field('道闸状态',g==='open'?'已开启':'关闭 / 待命')}${field('通道关联车辆',u+' 辆')}${field('车牌识别摄像头','CAM-'+gate)}${field('支付采集终端','启用 · 非现金')}</div>${divLine}<div class="callout"><h4>出入场联动</h4><p>入口采集车牌、车辆尺寸与航班信息后请求车位分配；出口根据车牌查找计费记录，完成数字支付或自动扣款后由控制中心发出开闸指令。</p></div>`,`${btn('open-gate',icon('lock',14)+' 手动开闸测试','btn primary','data-gate="'+gate+'"')}${btn('close-modal','关闭','btn')}`);

function openDevice(id,kind){let spid=id.replace(/^(CAM-|SNR-)/,'');const sp=getSpot(spid);const gate=id.startsWith('BAR-')?id.slice(4):null;
 if(gate){openGate(gate);return}
 let zone=sp?.zone||ZONES.find(z=>id.includes('-'+z+'-'))||'—';let online=sp?(kind==='camera'?sp.cam:sp.sensor)==='online':true;
 let body=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div><div class="eyebrow">PHYSICAL DEVICE / DRIVER SIMULATOR</div><div class="mono" style="font-weight:850;font-size:20px">${safe(id)}</div></div><span class="pill ${online?'green':'red'}">${online?'● ONLINE':'● OFFLINE'}</span></div><div class="detail-grid">${field('设备类型',kind==='sensor'?'地磁占用传感器':'车牌识别摄像头')}${field('所属区域',`Zone ${zone}`)}${field('关联车位',spid!==id&&sp?sp.id:'区域通道设备')}${field('通信链路',online?'TCP / 模拟在线':'心跳超时')}${field('自检状态',online?'全部通过':'异常 / 请恢复')}${field('数据更新时间',fmt(state.now))}</div>`;
 body+=divLine+`<div class="callout"><h4>${kind==='sensor'?'传感器事件接口':'摄像头 OCR 事件接口'}</h4><p>${kind==='sensor'?'接收车辆压感信号 → 通知分配缓存 → 再次校验车牌 → 更新车位占用。':'车辆抵达/离位时完成车牌识别，并与指定停车位的授权车牌交叉核验。'} 本原型使用模拟驱动，最终 JavaFX 客户端可对接真实硬件驱动。</p></div>`;
 modal('物联设备详情',body,`${btn('selftest-device',icon('refresh',14)+' 立即自检','btn','data-id="'+id+'"')}${sp?btn('toggle-device',online?'模拟故障':'恢复设备','btn '+(online?'danger':'good'),'data-id="'+id+'"'):''}${btn('close-modal','关闭','btn')}`);
}
function openSession(id){const s=getSession(id);if(!s)return;const fee=s.parkedAt?getRateMin(stayMinutes(s),s.userClass,s.fine||0):null;
 let body=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:17px"><div class="eyebrow">PARKING SESSION ${s.id}</div>${sessionBadge(s.status)}</div><div class="detail-grid">${field('车牌',s.plate)}${field('用户类别',USER_TYPES[s.userClass])}${field('航班 / 目的地',`${s.flight} · Hall ${s.hall}`)}${field('入口',GATES[s.gate])}${field('分配车位',s.assignedSpot)}${field('实际停放车位',s.actualSpot||'尚未停入')}${field('入场识别',fmt(s.enteredAt))}${field('传感器入位',s.parkedAt?fmt(s.parkedAt):'—')}${field('传感器离位',s.leftAt?fmt(s.leftAt):'—')}${field('最终出场',s.exitedAt?fmt(s.exitedAt):'—')}</div>`;
 if(fee)body+=divLine+`<h4 class="section-title" style="margin-bottom:12px">结算明细</h4><div class="detail-grid">${field('计费时长',stayMinutes(s)+' 分钟')}${field('原始费用',currency(fee.base))}${field('优惠比例',number(fee.discount*100)+'%')}${field('违规附加费用',currency(fee.fine))}${field('应付金额',currency(fee.total))}${field('支付状态',s.paid?'已结算':s.status==='payment'?'待数字支付':'未到结算环节')}</div>`;
 let controls=`${btn('locate-spot',icon('map',14)+' 地图定位','btn','data-spot="'+s.assignedSpot+'"')}${s.status==='assigned'?btn('park-now','模拟入位','btn primary','data-session="'+s.id+'"'):''}${s.status==='parked'?btn('leave-now','模拟离位','btn primary','data-session="'+s.id+'"'):''}${s.status==='departing'?btn('arrive-exit','到达出口','btn primary','data-session="'+s.id+'"'):''}${s.status==='payment'?btn('pay-session','数字支付','btn primary','data-session="'+s.id+'"'):''}${btn('close-modal','关闭','btn')}`;
 modal('车辆停车会话',body,controls);
}
function downloadFile(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csvExport(){const head=['timestamp','type','event','reference'];const quote=s=>'"'+String(s??'').replaceAll('"','""')+'"';const rows=[head.join(','),...state.logs.map(l=>[fulltime(l.at),l.type,l.message,l.ref].map(quote).join(','))];downloadFile('MIA_parking_events.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8');toast('CSV 日志已导出','green')}
function writeModalHelp(){modal('操作指南 · MIA Parking Control',`<div style="display:grid;gap:12px"><div class="callout"><h4>① 停车场总览</h4><p>点击任意 Zone、航站楼 Hall、摄像头、传感器和入口闸机可查看详细信息。进入 Zone 后可点击车道 AISLE，逐级放大至每个车位与小车。</p></div><div class="callout"><h4>② 时间与车辆模拟</h4><p>在总览底部点击「启动仿真」，地图中的车辆会沿西、东、南入口向系统分配的车位移动。可切换 1×、4×、12×、单步执行以及注入安全异常。</p></div><div class="callout"><h4>③ 业务功能</h4><p>顶部切换车位管理、车辆入离场、安防、收费、设备、订阅、日志统计与数据备份。操作变更将关联实时状态与日志。</p></div><div class="callout"><h4>④ 数据保存</h4><p>系统使用本地浏览器存储自动保留演示数据；备份页面可导出 JSON、导入状态或模拟从崩溃快照重建。</p></div></div>`,btn('close-modal','开始使用','btn primary'))}
function doDeviceToggle(id){const sp=getSpot(id.replace(/^(CAM-|SNR-)/,''));if(!sp)return;let key=id.startsWith('CAM-')?'cam':'sensor';const turningOff=sp[key]==='online';sp[key]=turningOff?'offline':'online';if(turningOff){if(sp.status==='free')sp.status='disabled';alertNew('red','物联设备离线',`${id} 模拟故障，关联车位 ${sp.id} 已标记不可继续分配`,sp.id,'fault')}else{if(sp.status==='disabled'&&sp.cam==='online'&&sp.sensor==='online')sp.status='free';log('device',`${id} 已恢复上线并校验关联车位 ${sp.id}`,sp.id);toast(id+' 已恢复上线','green')}save();closeModal();render()}
function doSelfTest(id){const sp=getSpot(id.replace(/^(CAM-|SNR-)/,''));let offline=sp&&(id.startsWith('CAM-')?sp.cam:sp.sensor)==='offline';log('device',`${id} 设备自检${offline?'失败':'通过'} · 数据同步${offline?'中断':'正常'}`,id);toast(`${id} 自检${offline?'失败：设备离线':'通过'}`,offline?'red':'green');save();}
function action(a,el){const d=el.dataset;
 switch(a){

 case 'close-modal':closeModal();break;
 case 'show-all':ui.depth='all';render();break;

 case 'focus-zone':ui.zone='B';ui.depth='zone';render();break;
 case 'module-spaces':ui.page='spaces';ui.zone=ui.zone||'B';render();break;
 case 'open-zone-map':ui.page='dashboard';ui.depth='zone';render();break;
 case 'module-logs':toPage('logs');break;

 case 'session-detail':openSession(d.session);break;
 case 'start':start();break;
 case 'pause':stop();render();toast('仿真已暂停');break;
 case 'step':tick(true);break;
 case 'spawn':randomArrival();render();break;
 case 'inject':injectAnomaly(pick(['illegal','overtime','fault','capacity']));render();break;

 case 'manual-entry':{
  const s=addEntry({plate:$('entry-plate').value,userClass:$('entry-user').value,hall:+$('entry-hall').value,gate:$('entry-gate').value,flight:$('entry-flight').value.trim(),duration:+$('entry-duration').value,ev:$('entry-ev').checked,accessible:$('entry-access').checked,urgent:$('entry-urgent').checked});if(s)render();break;}
 case 'park-now':{const s=getSession(d.session);parkSession(d.session);state.motions=state.motions.filter(m=>m.sessionId!==d.session);log('parking',`${s?.plate} 已通过人工模拟确认车位传感器事件`,s?.assignedSpot);closeModal();save();render();break;}
 case 'leave-now':leaveSpot(d.session);closeModal();render();break;
 case 'arrive-exit':finishExit(d.session);state.motions=state.motions.filter(m=>m.sessionId!==d.session);closeModal();render();break;

 case 'locate-spot':{const sp=getSpot(d.spot);if(sp){ui.page='dashboard';ui.zone=sp.zone;ui.aisle=sp.aisle;ui.depth='aisle';closeModal();render()}break;}
 case 'disable-spot':{let s=getSpot(d.spot);if(s?.status==='free'){s.status='disabled';log('device',`控制中心停用车位 ${s.id}`,s.id);toast(`车位 ${s.id} 已停用`);save();closeModal();render()}break;}
 case 'enable-spot':{let s=getSpot(d.spot);if(s?.status==='disabled'){if(s.cam==='offline'||s.sensor==='offline'){toast('需要先恢复摄像头和传感器才能启用车位','red')}else{s.status='free';log('device',`控制中心重新启用车位 ${s.id}`,s.id);save();closeModal();render();toast('车位已重新开放','green')}}break;}
 case 'ack-alert':{const q=state.alerts.find(x=>x.id===d.id);if(q){q.status='ack';q.assignedTo='巡逻队 Alpha';log('security',`控制中心已确认 ${q.id}，派遣巡逻队 Alpha`,q.spotId||q.type);save();render()}break;}
 case 'resolve-alert':{const q=state.alerts.find(x=>x.id===d.id);if(q){q.status='resolved';log('security',`安全事件 ${q.id} 已标记处理完成`,q.spotId||q.type);save();render()}break;}
 case 'resolve-all':state.alerts.forEach(q=>q.status='resolved');log('security','批量关闭安全事件','CONTROL');save();render();toast('所有告警已标记已处理');break;
 case 'estimate-fee':{const n=+($('fee-hours')?.value||0),user=$('fee-user')?.value;if(!(n>0&&n<=5000)){toast('请输入 1–5000 小时','red');break}$('fee-estimate').textContent=currency(getRateMin(n*60,user).total);break;}
 case 'selftest-all':{log('device','执行全网设备自检与状态核验','ALL');save();toast(`自检完成：${deviceOnline()} 台在线设备 · ${deviceRows().filter(d=>d.status==='offline').length} 台异常`,'green');break;}
 case 'selftest-device':doSelfTest(d.id);break;
 case 'toggle-device':doDeviceToggle(d.id);break;
 case 'create-user':{const name=$('new-user-name').value.trim(),plate=$('new-user-plate').value.trim().toUpperCase(),cl=$('new-user-class').value;if(!name||!/^[A-Z0-9-]{4,15}$/.test(plate)){toast('请输入客户名称与有效车牌','red');break}state.users.push({id:`SUB-${++state.seq}`,name,plate,userClass:cl,state:'active'});log('system',`新增用户账户 ${name} / ${plate}`,plate);save();render();toast('订阅账户已添加','green');break;}
 case 'export-logs':csvExport();break;
 case 'clear-logs':if(confirm('确定清空全部演示日志吗？车位和会话不会被删除。')){state.logs=[];save();render()}break;
 case 'speed':setSettings('speed',+d.speed);render();break;
 case 'preset':{const p=d.preset;if(p==='rush'){state.settings.arrival=90;state.settings.anomaly=3;state.settings.stay=45;state.settings.speed=4}else if(p==='normal'){state.settings.arrival=45;state.settings.anomaly=3;state.settings.stay=90;state.settings.speed=4}else if(p==='incident'){state.settings.arrival=60;state.settings.anomaly=25;state.settings.stay=80;state.settings.speed=4;injectAnomaly('fault',true);injectAnomaly('illegal',true)}else if(p==='long'){state.settings.arrival=35;state.settings.anomaly=5;state.settings.stay=500;state.settings.speed=12}save();render();toast('已应用场景预设：'+{rush:'早高峰',normal:'日常稳态',incident:'安全应急',long:'长周期'}[p]);break;}
 case 'reset-scene':if(confirm('是否恢复原始演示场景？当前所有车辆与日志数据将重置。'))resetEverything();break;
 case 'take-backup':if(snapshot()){render();toast('完整状态快照已保存到浏览器','green')}break;
 case 'export-backup':downloadFile('MIA_Parking_Backup_'+fulltime(state.now).slice(0,10)+'.json',JSON.stringify({...state,run:false,motions:[]},null,2),'application/json;charset=utf-8');toast('状态 JSON 已导出','green');break;
 case 'import-backup':$('import-file').click();break;
 case 'restore-backup':{
  let snap;try{snap=JSON.parse(localStorage.getItem(BKEY))}catch(e){}if(!snap){toast('没有可恢复的快照','red');break}if(!confirm('从上次快照恢复将覆盖当前演示状态。是否继续？'))break;stop();state=snap;state.run=false;state.motions=[];log('system','恢复了保存的缓存快照，并模拟重新扫描设备状态','RECOVERY');save();render();toast('已恢复快照，停车场状态重新同步','green');break;}
 case 'crash-restart':{
 let snap;try{snap=JSON.parse(localStorage.getItem(BKEY))}catch(e){}if(!snap){snapshot();snap=JSON.parse(localStorage.getItem(BKEY))}
 if(!confirm('模拟异常退出并从最近快照重建？自上次快照以来的未保存更改将丢失。'))break;stop();state=snap;state.run=false;state.motions=[];state.gateStates={WEST:'idle',EAST:'idle',SOUTH:'idle'};log('system','[CRASH / RESTART] 从缓存备份重建，设备重新发送状态，恢复完成','RECOVERY');save();render();toast('模拟应用重启成功，已从快照恢复','green');break;}
 default:toast('该操作暂未启用','red');
 }
}
document.addEventListener('click',ev=>{
 const tab=ev.target.closest('[data-page]');if(tab){toPage(tab.dataset.page);return}
 const target=ev.target.closest('[data-action]');if(target){ev.preventDefault();action(target.dataset.action,target)}
 else if(ev.target===$('modal-back'))closeModal();
});
document.addEventListener('change',ev=>{const e=ev.target;
 if(e.hasAttribute('data-ui')){ui[e.dataset.ui]=e.value;render();return}
 if(e.hasAttribute('data-setting')){const k=e.dataset.setting;const val=e.type==='checkbox'?e.checked:Number(e.value);setSettings(k,val);if(ui.page==='simulation'||ui.page==='backup')render();return}
});
document.addEventListener('input',ev=>{const e=ev.target;if(e.type==='range'&&e.hasAttribute('data-setting')){const out=$('out-'+e.dataset.setting);if(out)out.textContent=e.value+(['stay'].includes(e.dataset.setting)?' 分':e.dataset.setting==='maxConcurrent'?' 辆':'%')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='space-search')action('apply-space-filter',e.target);if(e.key==='Enter'&&e.target.id==='device-search')action('apply-device-filter',e.target)});
$('import-file').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(incoming.version!==3||!Array.isArray(incoming.spots)||incoming.spots.length!==144||!Array.isArray(incoming.sessions)||!Array.isArray(incoming.logs)||!Array.isArray(incoming.alerts)||!incoming.settings)throw Error('格式错误');stop();state={...incoming,run:false,motions:[]};snapshot();log('system','从 JSON 文件导入状态与设备缓存','IMPORT');save();render();toast('状态文件导入成功','green')}catch(ex){toast('导入失败：文件与此演示版本不兼容','red')}e.target.value=''};reader.readAsText(file)});
// Persist a checkpoint on first launch so the crash demonstration always has a restore point.
let hasBackup=false;try{hasBackup=!!localStorage.getItem(BKEY)}catch(e){}
if(!hasBackup)snapshot(true);
render();
})();
</script>
</body></html>
